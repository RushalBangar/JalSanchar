name: Keep-Alive Backend Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render API
    runs-on: ubuntu-latest
    steps:
      - name: Health Check Ping
        run: |
          curl -f -s -S --connect-timeout 20 --max-time 90 --retry 2 --retry-delay 5 https://jalsanjeevani.onrender.com/health || echo "Render waking up..."
