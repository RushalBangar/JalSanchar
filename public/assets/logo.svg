<svg width="260" height="56" viewBox="0 0 260 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular Sovereign Crest -->
  <defs>
    <linearGradient id="crestGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="16" y1="12" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#00A896"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Crest Ring -->
  <circle cx="28" cy="28" r="24" fill="url(#crestGrad)" stroke="#0077B6" stroke-width="1.5"/>
  <circle cx="28" cy="28" r="21" stroke="#00A896" stroke-width="0.75" stroke-dasharray="3 2" opacity="0.8"/>

  <!-- Satellite Telemetry Orbit Ring -->
  <ellipse cx="28" cy="28" rx="18" ry="8" stroke="#38BDF8" stroke-width="1.2" transform="rotate(-25 28 28)" stroke-dasharray="4 2"/>
  <circle cx="14" cy="21" r="2" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="42" cy="35" r="1.5" fill="#00A896"/>

  <!-- Water Droplet Core -->
  <path d="M28 14 C28 14 19 25 19 30 C19 34.97 23.03 39 28 39 C32.97 39 37 34.97 37 30 C37 25 28 14 28 14 Z" fill="url(#dropGrad)"/>
  <path d="M28 18 C28 18 22 26 22 30 C22 32.5 24 35 27 35.5 C25.5 34 25 32 25.5 30 C26 27.5 28 22 28 18 Z" fill="#FFFFFF" opacity="0.45"/>

  <!-- Brand Typography -->
  <text x="62" y="27" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="20" fill="#0B2545" letter-spacing="-0.02em">JalSanchar</text>
  <text x="62" y="43" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#0077B6" letter-spacing="0.04em">जलसंचार • WATER LOGISTICS</text>
</svg>
